<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1917" />
    <meta name="color-scheme" content="dark" />
    <title>SafeAid TEST UI</title>
    <link rel="stylesheet" href="./styles.css?v=20260730-1" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button id="homeButton" class="brand" type="button" aria-label="홈으로 이동">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>
            <strong>SAFEAID</strong>
            <small>FIELD CONSOLE</small>
          </span>
        </button>

        <div class="system-status" aria-label="장치 연결 상태">
          <span id="aiStatus" class="status-chip status-idle"><i></i>AI 확인 전</span>
          <span id="smsStatus" class="status-chip status-off"><i></i>문자 미연결</span>
          <span id="gpsStatus" class="status-chip status-off"><i></i>GPS 미수신</span>
          <time id="clock" class="clock" aria-label="현재 시각">--:--</time>
        </div>

        <button id="modeButton" class="mode-badge" type="button" aria-label="연결 상태와 실행 모드 보기">
          DEMO
        </button>
      </header>

      <main id="app" tabindex="-1" aria-live="polite" aria-busy="true"></main>

      <footer class="footer-note">
        AI는 경로만 분류합니다. 화면의 처치 문구는 검수된 고정 카드이며 의료진의 진단을 대신하지 않습니다.
      </footer>
    </div>

    <div id="toast" class="toast" role="status" aria-live="assertive" hidden></div>
    <noscript>이 화면은 JavaScript가 필요합니다. Chromium에서 JavaScript를 켜 주세요.</noscript>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
